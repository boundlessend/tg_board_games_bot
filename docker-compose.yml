x-logging: &default-logging
  # без ротации json-лог растёт до заполнения диска
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  bot:
    build: .
    container_name: tg-board-games
    # .env опционален: BOT_TOKEN/ADMIN_IDS можно задать и через окружение
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /db/bot.sqlite3
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    <<: *default-hardening
    # база лежит в томе /db и остаётся доступной на запись,
    # остальная файловая система только для чтения
    read_only: true
    tmpfs:
      # health.py держит здесь отметку живости
      - /tmp
    volumes:
      - db:/db

  backup:
    build: .
    container_name: tg-board-games-backup
    command:
      - python
      - scripts/backup.py
      - --database=/db/bot.sqlite3
      - --backup-dir=/backups
      - --interval=86400
      - --keep=7
    environment:
      DATABASE_PATH: /db/bot.sqlite3
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    <<: *default-hardening
    # HEALTHCHECK из образа проверяет отметку живости бота, которой здесь нет
    healthcheck:
      disable: true
    # VACUUM INTO не должен обрываться по SIGKILL на середине снимка
    stop_grace_period: 120s
    volumes:
      - db:/db
      # bind-mount вместо тома: снимки живут рядом с проектом и уносятся
      # обычным rsync, не завися от docker-демона. каталог должен
      # принадлежать uid 1000 (пользователь app из образа)
      - ./backups:/backups

volumes:
  db:

[project]
name = "tg-board-games"
version = "5.0.0"
description = "Telegram-бот с помощниками для настольных игр"
requires-python = ">=3.14"
license = { text = "BSD-3-Clause" }
# прямые зависимости - в requirements.txt, полный набор с хэшами -
# в requirements.lock: из него собирается docker-образ
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
# рантайм и проверка типов идут на 3.14, а форматтеру оставлен py313:
# на py314 он переписывает except (A, B) в синтаксис PEP 758 без скобок,
# который mypy пока не разбирает
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (длина строки) исторически не enforced в этом коде
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]

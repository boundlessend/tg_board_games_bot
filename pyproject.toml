[project]
name = "tg-board-games"
version = "5.0.0"
description = "Telegram-бот с помощниками для настольных игр"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
# рабочий набор ставится из requirements.txt с точными версиями:
# он же уходит в docker-образ, чтобы сборка была воспроизводимой
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (длина строки) исторически не enforced в этом коде
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
